name: Build AimMap
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Ad units and product id
        run: |
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          INT_ID="${ADMOB_INTERSTITIAL_ID:-ca-app-pub-3940256099942544/1033173712}"
          TEST=true
          if [ -n "$ADMOB_INTERSTITIAL_ID" ] && [ -n "$ADMOB_APP_ID" ]; then TEST=false; fi
          cat > src/config.js <<CFG
          export const PRO_ID = 'aimmap_pro';
          export const INTERSTITIAL_ID = '$INT_ID';
          export const ADS_TEST = $TEST;
          CFG
          echo "EFFECTIVE_ADMOB_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          cat src/config.js

      - name: Bundle native bridge
        run: npx esbuild src/native.js --bundle --format=iife --minify --target=chrome100 --outfile=www/native.js

      - name: Create Android project
        run: npx cap add android
      - name: Inspect Android application ID
        run: |
          grep -n -E 'applicationId|namespace|defaultConfig' android/app/build.gradle android/app/build.gradle.kts || true

      - name: Icon, splash, permissions, AdMob id, version
        run: |
          R=android/app/src/main/res
          find $R -name 'ic_launcher*' -delete
          find $R -name 'splash*' -delete
          cp -r res-overlay/* $R/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application#' $M
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$EFFECTIVE_ADMOB_APP_ID\"/>\n    </application>#" $M
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/^    applicationId .*/    applicationId "com.aimmap.myapp"/' android/app/build.gradle
          grep -n "permission\|APPLICATION_ID" $M
          grep -n "versionCode" android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK and release bundle
        run: cd android && ./gradlew assembleDebug bundleRelease

      - name: Sign release bundle (upload key)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: AimMap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AimMap-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
